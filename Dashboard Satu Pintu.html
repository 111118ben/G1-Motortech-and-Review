<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dashboard Satu Pintu</title>
<style>
:root{--bg:#f4f6fb;--panel:#fff;--text:#14182b;--mute:#667;--line:#e3e7f2;--a1:#6366f1;--a2:#06b6d4;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b0e1a;--panel:#141830;--text:#eef1ff;--mute:#9aa3c7;--line:#252b4a}}
:root[data-theme="dark"]{--bg:#0b0e1a;--panel:#141830;--text:#eef1ff;--mute:#9aa3c7;--line:#252b4a}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;overflow:hidden}
aside{width:250px;background:var(--panel);border-right:1px solid var(--line);padding:20px 14px;display:flex;flex-direction:column;gap:6px;flex-shrink:0}
.brand{font-weight:800;font-size:18px;padding:6px 10px 18px;background:linear-gradient(90deg,var(--a1),var(--a2));-webkit-background-clip:text;background-clip:text;color:transparent}
.nav{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:12px;border:0;background:none;color:var(--text);font-size:14px;cursor:pointer;text-align:left;width:100%}
.nav:hover{background:var(--bg)}
.nav.on{background:linear-gradient(90deg,var(--a1),var(--a2));color:#fff;box-shadow:0 6px 18px rgba(99,102,241,.35)}
.spacer{flex:1}
main{flex:1;display:flex;flex-direction:column;min-width:0}
header{display:flex;align-items:center;gap:10px;padding:12px 18px;border-bottom:1px solid var(--line);background:var(--panel)}
header h1{font-size:16px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn{border:1px solid var(--line);background:var(--bg);color:var(--text);padding:8px 12px;border-radius:10px;cursor:pointer;font-size:13px;text-decoration:none}
.btn:hover{border-color:var(--a1)}
.view{flex:1;position:relative;overflow:auto}
#home{padding:28px}
.hero{padding:30px;border-radius:20px;color:#fff;background:linear-gradient(135deg,var(--a1),var(--a2));box-shadow:0 14px 40px rgba(99,102,241,.35)}
.hero h2{font-size:26px;margin-bottom:6px}.hero p{opacity:.9}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px;margin-top:22px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:22px;cursor:pointer;transition:.2s}
.card:hover{transform:translateY(-4px);border-color:var(--a1);box-shadow:0 12px 30px rgba(99,102,241,.2)}
.card .ic{font-size:34px;margin-bottom:10px}.card h3{margin-bottom:6px}.card p{color:var(--mute);font-size:14px}
iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff}
.hide{display:none}
@media(max-width:720px){aside{position:fixed;bottom:0;left:0;right:0;width:auto;flex-direction:row;z-index:5;padding:6px;border-right:0;border-top:1px solid var(--line);padding-bottom:calc(6px + env(safe-area-inset-bottom,0px))}
.brand,.spacer{display:none}.nav{flex-direction:column;gap:2px;font-size:11px;justify-content:center;text-align:center;padding:8px 4px}
body{flex-direction:column}main{padding-bottom:62px}#home{padding:16px}}
</style></head><body>
<aside><div class="brand">✨ Dashboard Satu Pintu</div><div id="nav"></div><div class="spacer"></div></aside>
<main>
<header><h1 id="ttl"></h1><button class="btn" id="th">🌓 Tema</button><a class="btn hide" id="ext" target="_blank" rel="noopener">↗ Buka tab baru</a></header>
<div class="view"><div id="home"></div><iframe id="fr" class="hide" title="app" allow="fullscreen"></iframe></div>
</main>
<script>
const CFG={"title": "Dashboard Satu Pintu", "apps": [{"id": "awesome", "name": "Awesome Dashboard", "desc": "Dashboard utama untuk memantau data dan informasi.", "icon": "📊", "url": "https://111118ben.github.io/awesome-dashboard/"}, {"id": "umpan", "name": "Format Umpan Balik", "desc": "Formulir format umpan balik yang rapi dan siap pakai.", "icon": "📝", "url": "https://111118ben.github.io/Format-Umpan-Balik/"}]};
const $=id=>document.getElementById(id);
const items=[{id:"home",name:"Beranda",icon:"🏠"},...CFG.apps];
$("nav").innerHTML=items.map(a=>`<button class="nav" data-id="${a.id}"><span>${a.icon}</span><span>${a.name}</span></button>`).join("");
$("home").innerHTML=`<div class="hero"><h2>Selamat datang 👋</h2><p>Satu pintu untuk semua aplikasi Anda.</p></div><div class="grid">`+
CFG.apps.map(a=>`<div class="card" data-id="${a.id}"><div class="ic">${a.icon}</div><h3>${a.name}</h3><p>${a.desc}</p></div>`).join("")+`</div>`;
function go(id){
  const a=CFG.apps.find(x=>x.id===id);
  document.querySelectorAll(".nav").forEach(n=>n.classList.toggle("on",n.dataset.id===id));
  $("home").classList.toggle("hide",!!a);$("fr").classList.toggle("hide",!a);$("ext").classList.toggle("hide",!a);
  $("ttl").textContent=a?a.name:"Beranda";
  if(a){if($("fr").dataset.id!==id){$("fr").src=a.url;$("fr").dataset.id=id}$("ext").href=a.url}
  try{location.hash=id}catch(e){}
}
document.addEventListener("click",e=>{const t=e.target.closest("[data-id]");if(t)go(t.dataset.id)});
$("th").onclick=()=>{const r=document.documentElement;const d=getComputedStyle(r).getPropertyValue("--bg").trim()==="#0b0e1a";r.dataset.theme=d?"light":"dark"};
go((location.hash||"#home").slice(1)||"home");
</script></body></html>
